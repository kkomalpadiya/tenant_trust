name: tenant-trust

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: ${REDIS_IMAGE}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  nats:
    image: ${NATS_IMAGE}
    command:
      - -c
      - /etc/nats/nats-server.conf
    environment:
      NATS_USER: ${NATS_USER}
      NATS_PASSWORD: ${NATS_PASSWORD}
      NATS_TENANT_ALPHA_USER: ${NATS_TENANT_ALPHA_USER}
      NATS_TENANT_ALPHA_PASSWORD: ${NATS_TENANT_ALPHA_PASSWORD}
      NATS_TENANT_BETA_USER: ${NATS_TENANT_BETA_USER}
      NATS_TENANT_BETA_PASSWORD: ${NATS_TENANT_BETA_PASSWORD}
    ports:
      - "127.0.0.1:${NATS_HOST_PORT}:4222"
    volumes:
      - nats-data:/data/jetstream
      - ../nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - 'http://127.0.0.1:8222/healthz?js-enabled-only=true' | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  step-ca:
    image: ${STEP_CA_IMAGE}
    entrypoint: ["step-ca"]
    command:
      - /home/step/config/ca.json
      - --password-file
      - /run/secrets/step_ca_password
    ports:
      - "127.0.0.1:${STEP_CA_HOST_PORT}:9000"
    volumes:
      - step-ca-data:/home/step
      - ../pki/verify-issuance.sh:/scripts/verify-issuance.sh:ro
    secrets:
      - step_ca_password
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  opa:
    image: ${OPA_IMAGE}
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-format=json
      - /policies
    ports:
      - "127.0.0.1:${OPA_HOST_PORT}:8181"
    volumes:
      - ../../policies:/policies:ro
    healthcheck:
      test: ["CMD-SHELL", "/bin/busybox netstat -lnt | grep -q ':8181 '"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  step-ca-init:
    image: ${STEP_CA_IMAGE}
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "/scripts/init-step-ca.sh"]
    environment:
      STEP_CA_NAME: Tenant Trust Local Platform CA
      STEP_CA_DNS_NAMES: localhost,step-ca
      STEP_CA_ADDRESS: :9000
      STEP_CA_PROVISIONER: platform-admin
    volumes:
      - step-ca-data:/home/step
      - ../pki/init-step-ca.sh:/scripts/init-step-ca.sh:ro
    secrets:
      - step_ca_password
    networks:
      - backend

  opa-test:
    image: ${OPA_IMAGE}
    profiles: ["tools"]
    entrypoint: ["/opa"]
    command: ["test", "/policies", "--verbose"]
    volumes:
      - ../../policies:/policies:ro
    networks:
      - backend

  migrate:
    image: ${POSTGRES_IMAGE}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../database/migrations:/migrations:ro
      - ./run-migrations.sh:/usr/local/bin/run-migrations:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/run-migrations"]
    networks:
      - backend

volumes:
  postgres-data:
    name: ${POSTGRES_VOLUME_NAME}
  redis-data:
    name: ${REDIS_VOLUME_NAME}
  nats-data:
    name: ${NATS_VOLUME_NAME}
  step-ca-data:
    name: ${STEP_CA_VOLUME_NAME}

networks:
  backend:
    name: ${BACKEND_NETWORK_NAME}

secrets:
  step_ca_password:
    file: ${STEP_CA_PASSWORD_FILE}
