name: tenant-trust

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: ${REDIS_IMAGE}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  nats:
    image: ${NATS_IMAGE}
    command:
      - --jetstream
      - --store_dir=/data/jetstream
      - --http_port=8222
      - --name=tenant-trust-local
      - --user=${NATS_USER}
      - --pass=${NATS_PASSWORD}
    ports:
      - "127.0.0.1:${NATS_HOST_PORT}:4222"
    volumes:
      - nats-data:/data/jetstream
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - 'http://127.0.0.1:8222/healthz?js-enabled-only=true' | grep -q '\"status\":\"ok\"'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  migrate:
    image: ${POSTGRES_IMAGE}
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../database/migrations:/migrations:ro
      - ./run-migrations.sh:/usr/local/bin/run-migrations:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/run-migrations"]
    networks:
      - backend

volumes:
  postgres-data:
    name: tenant-trust-postgres-data
  redis-data:
    name: tenant-trust-redis-data
  nats-data:
    name: tenant-trust-nats-data

networks:
  backend:
    name: tenant-trust-backend
