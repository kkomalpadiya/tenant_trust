server_name: tenant-trust-local
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
}

authorization {
  users: [
    {
      user: $NATS_USER
      password: $NATS_PASSWORD
      permissions: {
        publish: ">"
        subscribe: ">"
      }
    }
    {
      user: $NATS_TENANT_ALPHA_USER
      password: $NATS_TENANT_ALPHA_PASSWORD
      permissions: {
        publish: ["tenant.tnt_018f1234-5678-7abc-8def-0123456789ab.events.>"]
        subscribe: ["tenant.tnt_018f1234-5678-7abc-8def-0123456789ab.events.>", "_INBOX.>"]
      }
    }
    {
      user: $NATS_TENANT_BETA_USER
      password: $NATS_TENANT_BETA_PASSWORD
      permissions: {
        publish: ["tenant.tnt_018f1234-5678-7abc-8def-0123456789ac.events.>"]
        subscribe: ["tenant.tnt_018f1234-5678-7abc-8def-0123456789ac.events.>", "_INBOX.>"]
      }
    }
  ]
}
