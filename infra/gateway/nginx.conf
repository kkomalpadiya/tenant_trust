worker_processes auto;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log /dev/stderr warn;
  server_tokens off;

  server {
    listen 8443 ssl;
    server_name gateway.tenant-trust.local;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/tenant-trust/edge-server.crt;
    ssl_certificate_key /run/tenant-trust/edge-server.key;
    ssl_client_certificate /run/tenant-trust/platform-client-root.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_session_tickets off;

    location / {
      proxy_pass https://tenant-trust-api:8444;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host tenant-trust-api.internal;

      proxy_ssl_protocols TLSv1.2 TLSv1.3;
      proxy_ssl_server_name on;
      proxy_ssl_name tenant-trust-api.internal;
      proxy_ssl_trusted_certificate /run/tenant-trust/internal-root.crt;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 1;
      proxy_ssl_certificate /run/tenant-trust/gateway-client.crt;
      proxy_ssl_certificate_key /run/tenant-trust/gateway-client.key;

      proxy_set_header Tenant-Trust-Gateway-Version "1";
      proxy_set_header Tenant-Trust-Client-Verification $ssl_client_verify;
      proxy_set_header Tenant-Trust-Forwarded-Protocol $ssl_protocol;
      proxy_set_header Tenant-Trust-Client-Certificate $ssl_client_escaped_cert;

      proxy_set_header X-Forwarded-Client-Cert "";
      proxy_set_header X-Client-Cert "";
      proxy_set_header X-SSL-Client-Cert "";
      proxy_set_header X-Tenant-Id "";
      proxy_set_header X-Subject-Id "";

      proxy_hide_header Tenant-Trust-Gateway-Version;
      proxy_hide_header Tenant-Trust-Client-Verification;
      proxy_hide_header Tenant-Trust-Forwarded-Protocol;
      proxy_hide_header Tenant-Trust-Client-Certificate;
    }
  }
}
